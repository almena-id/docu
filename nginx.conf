# The documentation site's files, as `astro build` wrote them to dist/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers, on every answer (errors too). nginx drops a server's
    # add_header in a location that has one of its own, so /_astro/ repeats
    # them. The policy fits a static Starlight site: everything from this
    # origin — scripts, styles, the self-hosted typefaces, images and the
    # Pagefind search (its index fetched from /pagefind/, its WebAssembly
    # compiled here) — nothing from elsewhere, no frames of it anywhere.
    # Starlight writes small inline scripts (the theme, before the page
    # paints) and inline styles (the screenshots' marks), hence 'unsafe-inline';
    # with no third-party origin allowed, an injected script has nowhere to
    # load from or send to.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Starlight's own not-found page.
    error_page 404 /404.html;

    # Hashed build output never changes under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
