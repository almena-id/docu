# https://taskfile.dev
version: "3"

dotenv: [".env"]

vars:
  IMAGE: almena-docu:dev
  PORT: '{{.DOCU_PORT | default "4322"}}'

env:
  ASTRO_TELEMETRY_DISABLED: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  init:
    desc: Create .env from .env.example (an existing .env is left untouched)
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  install:
    desc: Install the dependencies from pnpm-lock.yaml
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
    generates:
      - node_modules/.modules.yaml

  dev:
    desc: Run the documentation site locally with hot reload
    deps: [install]
    cmds:
      - pnpm astro dev --port {{.PORT}}

  build:
    desc: Build the static site (dist/)
    deps: [install]
    cmds:
      - pnpm build

  preview:
    desc: Serve the production build locally (after task build)
    cmds:
      - pnpm astro preview --port {{.PORT}}

  sync:
    desc: Regenerate the content collection types (.astro/)
    deps: [install]
    cmds:
      - pnpm astro sync

  refs:
    desc: Regenerate what is generated — the API reference from a ../api checkout, the CLI's from ../almena (built here), the protocols from ../mediator and ../wallet
    deps: [install]
    cmds:
      - uv run --project ../api python scripts/openapi.py
      - node scripts/api-reference.mjs
      - cargo build --manifest-path ../almena/Cargo.toml --quiet
      - node scripts/cli-reference.mjs
      - node scripts/protocols.mjs

  demo:
    desc: Serve the real API on SQLite with a demo account, for the screenshots (a ../api checkout; port 8766, sessions in .demo/)
    cmds:
      - PYTHONPATH=../api uv run --project ../api python scripts/demo_api.py .demo

  status-demo:
    desc: Serve ../status on port 3200 with every probe answering and 90 made-up days, for its screenshot (scripts/status_demo.mjs; throwaway database in .demo/status/)
    cmds:
      - node scripts/status_demo.mjs

  screenshots:
    desc: Retake every screenshot, in every language and theme — registry and catalog served against `task demo` (REGISTRY_URL, CATALOG_URL), the wallet's interface from `pnpm dev` in ../wallet (WALLET_URL)
    deps: [install]
    cmds:
      - pnpm exec playwright install chromium
      - node scripts/screenshots.mjs
      - node scripts/wallet-screenshots.mjs

  check:
    desc: Everything that must pass before finishing a change (production build)
    cmds:
      - task: build

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the documentation site in Docker (detached) and wait until it is healthy
    cmds:
      - docker compose up --build --detach --wait

  down:
    desc: Stop and remove the Docker containers
    cmds:
      - docker compose down

  logs:
    desc: Follow the documentation site's container logs
    cmds:
      - docker compose logs --follow web

  health:
    desc: Query the running container's health endpoint
    cmds:
      - curl --fail --silent --show-error http://localhost:{{.PORT}}/health
    silent: true

  clean:
    desc: Remove node_modules, the build output and the local Docker image
    cmds:
      - rm -rf node_modules dist .astro
      - docker image rm -f {{.IMAGE}}

  clean:all:
    desc: Leave the repository as cloned — clean, plus the containers and their volumes, .env and the Task checksums
    prompt: Remove the containers and volumes and .env? They are recreated by `task init` and `task up`.
    cmds:
      # By the project's name, away from compose.yml: it needs no .env, so a
      # second run, or one after .env is gone, still works.
      - cd / && docker compose --project-name almena-docu down --volumes --remove-orphans
      - task: clean
      - rm -rf .task
      - find . -maxdepth 1 -name '.env*' ! -name '.env.example' -exec rm -f {} +
